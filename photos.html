<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos – Fatty Hookage</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .photo-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .photo-item:hover {
      transform: translateY(-3px);
      border-color: rgba(245, 166, 35, 0.4);
    }

    .photo-frame {
      aspect-ratio: 4/3;
      position: relative;
      overflow: hidden;
      background: var(--bg-card-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-frame img.loaded {
      display: block;
    }

    .photo-frame .placeholder-icon {
      font-size: 2.8rem;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .photo-frame.has-image .placeholder-icon {
      display: none;
    }

    .photo-frame input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .photo-frame .hover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(245, 166, 35, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 700;
      gap: 8px;
      pointer-events: none;
      z-index: 1;
    }

    .photo-frame:hover .hover-overlay {
      opacity: 1;
    }

    .photo-frame.has-image .hover-overlay span:first-child {
      display: none;
    }

    .photo-caption-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 10px 14px;
      font-family: inherit;
    }

    .photo-caption-input::placeholder {
      color: var(--border);
    }

    .photo-caption-input:focus {
      color: var(--text);
    }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.8;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 1rem;
    }

    .empty-state .big-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" href="index.html">Fatty <span>Hookage</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </button>
  </nav>

  <!-- DROPDOWN -->
  <div class="dropdown" id="dropdown">
    <a href="index.html">
      <span class="icon">🏠</span> Home
    </a>
    <a href="bios.html">
      <span class="icon">👥</span> Bios
    </a>
    <a href="photos.html">
      <span class="icon">📸</span> Photos
    </a>
  </div>

  <!-- CONTENT -->
  <div class="page">
    <div class="container">

      <div class="page-header">
        <h1>Group <span class="accent">Photos</span></h1>
        <p>The archive. Click any slot to add a photo.</p>
      </div>

      <!-- Upload area -->
      <div class="upload-area" id="mainUpload">
        <input type="file" id="mainFileInput" accept="image/*" multiple />
        <div class="upload-icon">📸</div>
        <p>Drop photos here or click to upload</p>
        <small>Upload multiple at once</small>
      </div>

      <!-- Photo grid -->
      <div class="photo-grid" id="photoGrid">
        <!-- Slots are generated by JS -->
      </div>

    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script src="script.js"></script>
  <script>
    const SLOT_COUNT = 12;
    const grid = document.getElementById('photoGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    // Load saved photos from localStorage
    const saved = JSON.parse(localStorage.getItem('fh_photos') || '{}');

    function savePhotos() {
      const data = {};
      document.querySelectorAll('.photo-item').forEach((item, i) => {
        const img = item.querySelector('.photo-frame img');
        const caption = item.querySelector('.photo-caption-input').value;
        if (img.src && img.src !== window.location.href) {
          data[i] = { src: img.src, caption };
        }
      });
      try {
        localStorage.setItem('fh_photos', JSON.stringify(data));
      } catch (e) {
        // localStorage full — images are too large; silently skip
      }
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    function loadImageIntoSlot(slot, src, caption = '') {
      const frame = slot.querySelector('.photo-frame');
      const img = frame.querySelector('img');
      const captionInput = slot.querySelector('.photo-caption-input');

      img.src = src;
      img.classList.add('loaded');
      frame.classList.add('has-image');
      if (caption) captionInput.value = caption;

      img.onclick = (e) => {
        e.stopPropagation();
        openLightbox(src);
      };
    }

    function createSlot(index) {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `
        <div class="photo-frame">
          <input type="file" accept="image/*" aria-label="Upload photo" />
          <img alt="Group photo" />
          <div class="placeholder-icon">📷</div>
          <div class="hover-overlay">
            <span>+ Add Photo</span>
            <span>🔍 View</span>
          </div>
        </div>
        <input type="text" class="photo-caption-input" placeholder="Add a caption..." />
      `;
      grid.appendChild(item);

      const fileInput = item.querySelector('input[type="file"]');
      const captionInput = item.querySelector('.photo-caption-input');

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          loadImageIntoSlot(item, ev.target.result);
          savePhotos();
        };
        reader.readAsDataURL(file);
      });

      captionInput.addEventListener('input', savePhotos);

      // Restore saved data
      if (saved[index]) {
        loadImageIntoSlot(item, saved[index].src, saved[index].caption);
      }
    }

    // Build slots
    for (let i = 0; i < SLOT_COUNT; i++) {
      createSlot(i);
    }

    // Main upload area — fills next empty slot(s)
    const mainFileInput = document.getElementById('mainFileInput');
    const uploadArea = document.getElementById('mainUpload');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      handleFiles(Array.from(e.dataTransfer.files));
    });

    mainFileInput.addEventListener('change', (e) => {
      handleFiles(Array.from(e.target.files));
    });

    function handleFiles(files) {
      const slots = Array.from(document.querySelectorAll('.photo-item'));
      const emptySlots = slots.filter(s => !s.querySelector('.photo-frame').classList.contains('has-image'));

      files.forEach((file, i) => {
        if (!file.type.startsWith('image/')) return;

        let target = emptySlots[i];
        if (!target) {
          // All slots full — create a new one
          createSlot(slots.length + i);
          target = grid.lastElementChild;
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          loadImageIntoSlot(target, ev.target.result);
          savePhotos();
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
